[versions]
kotlin = "2.4.10"
poko = "0.23.1"
agp = "9.2.0"
android-min-sdk = "26"
android-compile-sdk = "36"
coroutines = "1.11.0"
serialization = "1.11.0"
turbine = "1.2.1"
ktor = "3.5.2"
detekt = "1.23.8"
# Patched versions of PLUGIN-CLASSPATH transitives carrying advisories. Declared
# here so Dependabot has something to bump: it detected all six and opened no PR
# for any of them, because a transitive with no version declaration gives it
# nothing to edit. Forced onto the buildscript classpath in build.gradle.kts.
# bouncycastle covers BOTH bcprov and bcpkix, and must be 1.84 — not 1.80.2.
# bcprov carries two advisories: GOST 28147 CTR keystream reuse (critical, patched
# 1.80.2) AND LDAP injection (medium, vulnerable >= 1.74 < 1.84). Pinning 1.80.2 fixed
# the first and left the second — worse, the graph already resolved bcprov to 1.84 on
# its own, so `force("1.80.2")` DOWNGRADED it back into the vulnerable range. A force is
# a ceiling as well as a floor; a pin chosen from one advisory can undo another.
bouncycastle = "1.85"       # GOST CTR keystream reuse (critical) + LDAP injection (medium)
# 2.18.9, not 2.18.8: five jackson advisories are open and they do NOT share a patched
# version — four are fixed in 2.18.8 but one (databind, medium) needs 2.18.9, and
# jackson-core's older one needs only 2.18.6. Pinning the modal version leaves the
# outlier open. Same trap as the bouncycastle pin below: pick the MAXIMUM patched
# version across every advisory for the module, never the one the first alert names.
jackson = "2.22.1"          # PolymorphicTypeValidator + allowlist bypasses, async parser
jose4j = "0.9.6"            # DoS via compressed JWE content
jdom2 = "2.0.6.1"           # XXE injection
commons-lang3 = "3.20.0"    # uncontrolled recursion
# Enters ONLY through org.jetbrains.dokka:templating-plugin, i.e. the doc-generator runtime;
# jvmRuntimeClasspath carries no jsoup, so nothing ships it. Listed here anyway because an
# advisory stays open while any vulnerable version remains anywhere in the submitted graph,
# and Dependabot cannot bump a dependency no manifest declares — its security update failed
# with `security_update_dependency_not_found` until this pin existed.
jsoup = "1.23.1"            # stack-overflow / DoS in the HTML parser
# 4.5.14 (the last 4.5.x), not the advisory's minimum 4.5.13 — max-patched rule again.
# This one was missed for three rounds because the buildscript classpath already resolved
# 4.5.14 on its own, so it LOOKED fixed; androidLintTool still requested 4.5.6 unforced.
# "Already resolves high enough somewhere" is not the same as "pinned everywhere".
httpclient = "4.5.14"       # cross-site scripting in Apache HttpClient (< 4.5.13)
opentelemetry = "1.64.0"    # unbounded memory allocation parsing W3C baggage
konsist = "0.17.3"
kover = "0.9.9"
dokka = "2.2.0"
junit = "6.1.2"

[libraries]
# Build-classpath security pins — see the version comments above. Not shipped in
# the published artifact; these harden the BUILD, where a compromise is a
# supply-chain compromise.
bouncycastle-prov = { module = "org.bouncycastle:bcprov-jdk18on", version.ref = "bouncycastle" }
bouncycastle-pkix = { module = "org.bouncycastle:bcpkix-jdk18on", version.ref = "bouncycastle" }
jackson-core = { module = "com.fasterxml.jackson.core:jackson-core", version.ref = "jackson" }
jackson-databind = { module = "com.fasterxml.jackson.core:jackson-databind", version.ref = "jackson" }
jose4j = { module = "org.bitbucket.b_c:jose4j", version.ref = "jose4j" }
jdom2 = { module = "org.jdom:jdom2", version.ref = "jdom2" }
commons-lang3 = { module = "org.apache.commons:commons-lang3", version.ref = "commons-lang3" }
jsoup = { module = "org.jsoup:jsoup", version.ref = "jsoup" }
httpclient = { module = "org.apache.httpcomponents:httpclient", version.ref = "httpclient" }
opentelemetry-api = { module = "io.opentelemetry:opentelemetry-api", version.ref = "opentelemetry" }
kotlinx-coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlinx-coroutines-test = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "coroutines" }
kotlinx-serialization-json = { module = "org.jetbrains.kotlinx:kotlinx-serialization-json", version.ref = "serialization" }
ktor-client-core = { module = "io.ktor:ktor-client-core", version.ref = "ktor" }
ktor-client-cio = { module = "io.ktor:ktor-client-cio", version.ref = "ktor" }
ktor-client-mock = { module = "io.ktor:ktor-client-mock", version.ref = "ktor" }
turbine = { module = "app.cash.turbine:turbine", version.ref = "turbine" }
detekt-formatting = { module = "io.gitlab.arturbosch.detekt:detekt-formatting", version.ref = "detekt" }
detekt-cli = { module = "io.gitlab.arturbosch.detekt:detekt-cli", version.ref = "detekt" }
# Konsist: whole-codebase architecture invariants as jvmTest tests (declaration-level checks
# a single-file lint can't see). Verified to parse this Kotlin 2.4.0 source.
konsist = { module = "com.lemonappdev:konsist", version.ref = "konsist" }
# Custom detekt rule authoring + its unit-test harness (the :detekt-rules module).
detekt-api = { module = "io.gitlab.arturbosch.detekt:detekt-api", version.ref = "detekt" }
detekt-test = { module = "io.gitlab.arturbosch.detekt:detekt-test", version.ref = "detekt" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter = { module = "org.junit.jupiter:junit-jupiter" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

[plugins]
android-kotlin-multiplatform-library = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
kotlin-multiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
kotlin-serialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
poko = { id = "dev.drewhamilton.poko", version.ref = "poko" }
kover = { id = "org.jetbrains.kotlinx.kover", version.ref = "kover" }
dokka = { id = "org.jetbrains.dokka", version.ref = "dokka" }
