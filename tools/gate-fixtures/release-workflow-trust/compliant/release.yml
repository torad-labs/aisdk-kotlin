# Compliant shape: verification runs in a contents: read job that publish depends on,
# so the architecture gate still guards every release while the signing key never
# shares a job with third-party code. The credentialed job runs only the staging
# publish, which cannot be moved anywhere else.
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
      - name: Verify promoted version
        env:
          RELEASE_LINE: ${{ github.ref_name }}
        run: |
          project_version="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' gradle.properties)"
          if [[ "${project_version}" == *-SNAPSHOT ]]; then
            exit 1
          fi
          case "${RELEASE_LINE}" in
            beta) [[ "${project_version}" =~ -(alpha|beta|rc) ]] || exit 1 ;;
            prod) [[ "${project_version}" =~ -(alpha|beta|rc) ]] && exit 1 ;;
          esac
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main

  verify-apple:
    runs-on: macos-latest
    timeout-minutes: 75
    needs: preflight
    permissions:
      contents: read
    steps:
      - name: Verify Apple targets
        run: ./gradlew iosSimulatorArm64Test compileKotlinIosArm64 compileKotlinIosX64

  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs: preflight
    permissions:
      contents: read
    steps:
      - name: Fetch upstream reference
        run: git clone --depth 1 https://github.com/vercel/ai .ai-sdk-reference
      - name: Install locked Node tooling
        run: npm ci
      - name: Architecture gate
        run: bash .claude/hooks/rules/ci-gate.sh
      - name: Verify checks
        run: ./gradlew check

  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - preflight
      - verify-apple
      - verify-release
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    steps:
      - name: Build Maven Central release bundle
        run: ./gradlew publishAllPublicationsToLocalStagingRepository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
      # Compliant on purpose: the second Gradle build (smoke) lives in the SAME JOB as
      # the credentialed steps but in its own step with NO secret env — the exact split
      # shape the step-scoped check must accept. A job-scoped pattern would misfire here.
      - name: Smoke-test the staged artifacts
        run: tools/run-local-staging-smoke --no-publish --staging-repo build/staging-deploy
      - name: Publish to Maven Central
        run: ./tools/upload-central-bundle
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
