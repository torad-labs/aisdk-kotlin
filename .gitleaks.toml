# Repo-local gitleaks config, auto-loaded from the scan root.
#
# Generated 2026-07-31 from a full-history scan of every torad-labs repo.
# It NARROWS false-positive classes only — it never disables a rule and never
# turns off the default ruleset. Every entry below records why it is safe.
#
# Enforced by the `torad-standards` org ruleset via
# torad-labs/.github .github/workflows/org-secret-scan.yml.
#
# REWRITTEN 2026-08-01. The previous version used `regexTarget = "line"`, which
# suppresses the ENTIRE LINE a finding sits on — a real credential sharing a line
# with an allowlisted value would have been hidden. Demonstrated, not assumed:
# with the line form a canary planted beside an allowlisted hash was NOT reported
# (1 of 2 findings); with the match form below both fire (2 of 2).
#
# CORRECTED 2026-08-02. The 2026-08-01 rewrite replaced every full identifier
# with a SUFFIX, on a runbook claim that `regexTarget = "match"` truncates its
# target at the start so a full-identifier anchor never fires. That claim was
# never tested and is wrong here: measured against gitleaks v8.21.2, the FULL
# identifier silences the false positive AND still reports a real secret, while
# the suffix silenced both. `key…pk_` covered `secret_key = "pk_live_<token>"`,
# and `_DEFAULT_KEY_ID` covered `SECRET_DEFAULT_KEY_ID`. Full identifiers only.
[extend]
useDefault = true

[allowlist]
description = "Kotlin API-dump checksums and campaign fixtures"
paths = [
  # campaign baseline diffs — generated artefacts recording other files' contents.
  '''^dev/campaigns/.*\.(patch|json)$''',
]
regexTarget = "match"
regexes = [
  # binary-compatibility API dump checksums (…​.api / .klib.api), hex digests of the public API surface.
  '''\.api"\s*:\s*"[0-9a-f]{32,64}"''',
  # SHA-256 fingerprint of the campaign-proof PUBLIC key (the PEM below it is a public key). A key IDENTIFIER, not a secret.
  '''CAMPAIGN_PROOF_DEFAULT_KEY_ID\s*=\s*"[0-9a-f]{64}"''',
]
