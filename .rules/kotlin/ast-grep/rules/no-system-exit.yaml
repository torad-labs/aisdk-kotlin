# Vendored verbatim from torad-toolkit resources/configs/kotlin-rules (2026-07-25).
# Matcher unchanged on purpose. A published LIBRARY must never terminate its host
# process: exitProcess in SDK code kills the consumer's application, which is why this
# matters more here than in an app. Measured at vendoring: 0 hits.
# TENET (G60, imported+adapted from torad-toolkit resources/configs/kotlin-rules/ast-grep):
# System.exit()/exitProcess() bypasses cleanup, finally blocks, and shutdown hooks — a hard
# process kill instead of a graceful shutdown. Throw an exception and let the caller (or the
# application's own top-level entry point) decide how to shut down.
id: no-system-exit
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  # grandfather entries are per-repo; installs append their own
message: "no-system-exit: don't call System.exit()/exitProcess(). Throw an exception for graceful shutdown."
rule:
  any:
    - pattern: System.exit($CODE)
    - pattern: exitProcess($CODE)
