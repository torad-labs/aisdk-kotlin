# Vendored verbatim from torad-toolkit resources/configs/kotlin-rules (2026-07-25).
# Matcher unchanged on purpose: the upstream form is proven and re-deriving it is the
# waste this repo's rule work kept repeating. Especially load-bearing here — this SDK
# handles provider API keys, so a hardcoded `sk-...` in source is a live credential leak.
# Measured at vendoring: 0 hits across every scanned source set.
# TENET: No hardcoded secrets in code.
# Rationale: Secrets belong in environment variables or secure vaults.
# Never commit API keys, passwords, or tokens to source control.
id: no-hardcoded-secrets
language: kotlin
severity: error
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  - "**/test/**"
  - "**/*Test/**"
  - "**/testFixtures/**"
  # grandfather entries are per-repo; installs append their own
message: "Don't hardcode secrets. Use environment variables or secure vaults."
rule:
  kind: string_content
  regex: "(sk-[a-zA-Z0-9]{20,}|api[_-]?key\\s*=\\s*['\"][^'\"]{10,}|password\\s*=\\s*['\"][^'\"]+['\"]|Bearer\\s+[a-zA-Z0-9._-]{20,})"
