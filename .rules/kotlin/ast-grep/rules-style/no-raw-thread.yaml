# TENET: No raw Thread creation.
# Rationale: Use coroutines for async work. Raw threads bypass structured concurrency,
# can't be cancelled, and don't propagate context.
# Vendored from torad-toolkit (2026-07-25); severity lowered to warning on adoption.
#
# ACTIVE INVENTORY at vendoring — 1 site:
#   MCPStdioProcess.jvmAndAndroid.kt:36  stderr drain thread
#
# That site is well-reasoned and carries its rationale in-file: a daemon thread drains the
# child's stderr so a full pipe can never deadlock the child (a blocked stderr write stalls
# its stdout and hangs our JSON-RPC reader), stays version-independent because
# ProcessBuilder.Redirect.DISCARD needs Android API 28 while minSdk here is 26, and avoids
# redirectErrorStream(true), which would interleave stderr into the line-delimited JSON-RPC
# stdout and corrupt it.
#
# Kept at warning precisely so the signal stays visible without asserting that a considered
# decision is a defect. Promotion to LAW should follow a dispatcher-based replacement that
# preserves all three constraints above.
id: no-raw-thread
language: kotlin
severity: warning
# Scope law: exclude-based only — new files/folders are inside this law by default.
# Promoted from torad-fleet (2026-07-13, CR-TOOLKIT-PROMOTE); this pack is the clean
# canonical form — see sgconfig.yml for the full exclude-scope doctrine banner.
ignores:
  - "**/build/**"
  - "**/node_modules/**"
  - "**/dist/**"
  - "**/*.gradle.kts"
  - "**/test/**"
  - "**/*Test/**"
  - "**/testFixtures/**"
  # grandfather entries are per-repo; installs append their own
message: "Use coroutines instead of raw Thread. Threads bypass structured concurrency."
rule:
  any:
    - pattern: Thread($$$ARGS)
    - pattern: Thread { $$$BODY }
    - pattern: thread($$$ARGS)
    - pattern: thread { $$$BODY }
