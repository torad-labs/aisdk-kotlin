# BODY-LESS DECLARATIONS ARE EXEMPT — see the long-form reasoning in the sibling rule
# no-public-suspend-without-jvmsynthetic. Short version: satisfying this rule with @JvmSynthetic
# on an abstract/interface member emits ACC_ABSTRACT|ACC_SYNTHETIC, javac then ignores the member
# when checking that an implementor is complete, and a Java class implementing the interface
# compiles clean and throws AbstractMethodError at the first call. Proven against the built jar.
# A body-less member that returns Flow needs a Java-friendly WRAPPER, which is what this rule's
# own message asks for — the @JvmSynthetic escape hatch below is only valid for concrete members.
id: no-flow-return-without-wrapper
language: kotlin
severity: warning
message: "Public function returns Flow<...> directly. kotlinx.coroutines.Flow has no stable ABI for Java/Swift/Obj-C consumers of this KMP library — a raw Flow in the public surface forces every non-Kotlin caller to hand-roll a collector. Provide (or pair this with) a blocking/callback-friendly wrapper — a suspend function returning the terminal value, a listener-based API, or a platform-specific bridge — instead of exposing Flow as the only entry point."
rule:
  kind: function_declaration
  all:
    # Concrete declarations only — an abstract/interface member must not be silenced with
    # @JvmSynthetic (AbstractMethodError trap), so this rule does not ask it to be.
    - has: { kind: function_body }
    - has:
        kind: modifiers
        all:
          - has:
              kind: visibility_modifier
              regex: '^public$'
          # Exclude functions already marked @JvmSynthetic (hidden from Java)
          - not:
              has:
                kind: annotation
                has:
                  kind: user_type
                  has:
                    kind: type_identifier
                    regex: '^JvmSynthetic$'
    - has:
        kind: user_type
        all:
          - has:
              kind: type_identifier
              regex: '^Flow$'
          - follows:
              kind: function_value_parameters
              stopBy: end
