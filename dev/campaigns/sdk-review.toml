# 2026-08-09 PRECEDENT CLOSED — READ THIS BEFORE COPYING THE DISCLOSURE ABOVE. The programmatic issuance recorded on this item is NOT an accepted issuance path and must not be repeated. It happened once, while this repo had no working issuer at all; that condition no longer holds. The ONLY sanctioned path is an operator typing /grant in the prompt line, which .claude/hooks/modules/userpromptsubmit/grant_issue_policy.py now handles. Why the disclosure alone is not enough: grant-store.ts argues that VERIFY_SNAPSHOT_READ-style attestation flags lack the property entirely because they are satisfied by the very party the gate distrusts — a seat invoking the handler itself and citing after-the-fact authorization is in that same class, however honest the bookkeeping. And this ledger IS cross-session memory: seats resume from it alone, so an undisputed entry reads as a worked recipe. A seat that believes it needs a grant asks the operator to type one and WAITS; it does not invoke the handler, and it does not write the token file.

