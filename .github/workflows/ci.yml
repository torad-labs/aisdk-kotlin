name: CI

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: "17 8 * * *"

permissions:
  contents: read

# Cancel superseded runs on the same ref so a push-train does not burn runners.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AI_SDK_REFERENCE_VERSION: 6.0.208
  AI_SDK_REFERENCE_COMMIT: 3270146267b1d82f07972bc40f09e9b4ee8bb9d3
  # Update AST_GREP_SHA256 together with AST_GREP_VERSION; the package.json drift-check below enforces version consistency.
  AST_GREP_VERSION: '0.45.0'
  AST_GREP_SHA256: '78931ae35ebac33d9a72b3aecea3e3d62d6e5b0b718ac8bbedfbe69d68421e41'

jobs:
  reference-freshness:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Fetch Vercel AI SDK v6 reference
        id: fetch_reference
        run: |
          mkdir -p .reference
          if ! git clone --depth 1 --branch ai@${AI_SDK_REFERENCE_VERSION} https://github.com/vercel/ai .reference/vercel-ai-sdk-ai-${AI_SDK_REFERENCE_VERSION}; then
            echo "::warning::Unable to fetch Vercel AI SDK reference; skipping freshness/parity checks so internal gates still run."
            echo "available=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actual_commit="$(git -C .reference/vercel-ai-sdk-ai-${AI_SDK_REFERENCE_VERSION} rev-parse HEAD)"
          if [ "${actual_commit}" != "${AI_SDK_REFERENCE_COMMIT}" ]; then
            echo "Reference checkout commit is ${actual_commit}, expected ${AI_SDK_REFERENCE_COMMIT}" >&2
            exit 1
          fi
          echo "available=true" >> "$GITHUB_OUTPUT"
      - name: Verify AI SDK reference version
        if: steps.fetch_reference.outputs.available == 'true'
        run: node tools/check-ai-sdk-reference.mjs
      - name: Verify parity ledgers
        if: steps.fetch_reference.outputs.available == 'true'
        run: node tools/generate-parity-ledger.mjs --check

  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 75
    # Read-only. Issue creation lives in report-scheduled-failure, which runs no
    # repository-controlled code — this job runs `npm ci`, a downloaded ast-grep binary
    # and the full Gradle build, and a job's `permissions:` cannot be narrowed per step,
    # so granting `issues: write` here scoped a writable token to the whole build.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # This job runs `npm ci` (third-party lifecycle scripts), a downloaded ast-grep
          # binary, and the full Gradle build, so the job token must not sit in .git/config
          # for them to read. The failure-issue step gets it through env instead.
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      # `check` cross-compiles the iOS klibs on Linux, which downloads the
      # Kotlin/Native toolchain + dependencies into ~/.konan. setup-gradle only
      # caches ~/.gradle, so cache ~/.konan separately (keyed on the version
      # catalog so a Kotlin bump invalidates it). JetBrains-recommended.
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Cache ast-grep binary
        id: cache_ast_grep
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .tools/ast-grep/${{ env.AST_GREP_VERSION }}
          key: ast-grep-${{ runner.os }}-${{ env.AST_GREP_VERSION }}
      - name: Install ast-grep binary
        run: |
          set -euo pipefail
          package_version="$(node -p "require('./package.json').devDependencies['@ast-grep/cli']")"
          if [ "$package_version" != "$AST_GREP_VERSION" ]; then
            echo "AST_GREP_VERSION=$AST_GREP_VERSION does not match package.json @ast-grep/cli=$package_version" >&2
            exit 1
          fi

          install_dir="$PWD/.tools/ast-grep/$AST_GREP_VERSION"
          mkdir -p "$install_dir"
          if [ ! -x "$install_dir/ast-grep" ]; then
            tmp="$(mktemp -d)"
            trap 'rm -rf "$tmp"' EXIT
            curl -fsSL \
              "https://github.com/ast-grep/ast-grep/releases/download/${AST_GREP_VERSION}/app-x86_64-unknown-linux-gnu.zip" \
              -o "$tmp/ast-grep.zip"
            echo "$AST_GREP_SHA256  $tmp/ast-grep.zip" | sha256sum -c -
            unzip -q "$tmp/ast-grep.zip" -d "$tmp/extract"
            install -m 755 "$tmp/extract/ast-grep" "$install_dir/ast-grep"
          fi

          echo "$install_dir" >> "$GITHUB_PATH"
          "$install_dir/ast-grep" --version
      - name: Architecture gate (ast-grep rules + structural checks)
        id: architecture_gate
        continue-on-error: true
        run: ast-grep --version && bash .claude/hooks/rules/ci-gate.sh
      - name: Hook self-tests
        id: hook_self_tests
        continue-on-error: true
        run: |
          python3 .claude/hooks/tests/test_kotlin_antipattern_policy.py
          python3 .claude/hooks/tests/test_codex_hook_adapter.py
          python3 .claude/hooks/tests/test_fleet_protocol_policy.py
          python3 .claude/hooks/tests/test_rule_selfcheck_policy.py
      - name: Install locked Node tooling
        run: npm ci
      - name: Beta readiness gate
        id: beta_readiness
        continue-on-error: true
        run: tools/beta-readiness-check
      - name: Verify (tests + detekt + ABI + coverage)
        id: gradle_check
        continue-on-error: true
        run: ./gradlew check
      - name: Verify publication metadata
        id: publish_to_maven_local
        continue-on-error: true
        run: ./gradlew publishToMavenLocal
      # Dokka is otherwise only exercised at release-time docs deploy — the worst
      # moment to discover a KDoc generation failure.
      - name: Dokka generate
        id: dokka_generate
        continue-on-error: true
        run: ./gradlew dokkaGenerate
      - name: Summarize verify gates
        if: always()
        run: |
          gates=(
            "architecture_gate|Architecture gate (ast-grep rules + structural checks)|${{ steps.architecture_gate.outcome }}"
            "hook_self_tests|Hook self-tests|${{ steps.hook_self_tests.outcome }}"
            "beta_readiness|Beta readiness gate|${{ steps.beta_readiness.outcome }}"
            "gradle_check|Verify (tests + detekt + ABI + coverage)|${{ steps.gradle_check.outcome }}"
            "publish_to_maven_local|Verify publication metadata|${{ steps.publish_to_maven_local.outcome }}"
            "dokka_generate|Dokka HTML generation|${{ steps.dokka_generate.outcome }}"
          )

          failed=0
          printf '| Step id | Gate | Outcome |\n'
          printf '| --- | --- | --- |\n'
          for gate in "${gates[@]}"; do
            IFS='|' read -r step_id name outcome <<< "$gate"
            printf '| `%s` | %s | %s |\n' "$step_id" "$name" "$outcome"
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done

          exit "$failed"
      - name: Assert verify gate ledger
        if: always()
        run: |
          node tools/assert-expected-gates.mjs verify \
            "architecture-gate=${{ steps.architecture_gate.outcome }}" \
            "hook-self-tests=${{ steps.hook_self_tests.outcome }}" \
            "beta-readiness=${{ steps.beta_readiness.outcome }}" \
            "gradle-check=${{ steps.gradle_check.outcome }}" \
            "publish-to-maven-local=${{ steps.publish_to_maven_local.outcome }}" \
            "dokka-generate=${{ steps.dokka_generate.outcome }}"
      - name: Upload reports on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verify-reports-${{ github.run_id }}
          path: |
            build/reports/**
            **/build/reports/**
          if-no-files-found: ignore
          retention-days: 7
  # Isolated so the writable token never coexists with the build. Checks out `tools/`
  # only (sparse, blobless) and runs one first-party script — no Gradle, no npm, no
  # downloaded binaries — so nothing here can execute repository-controlled code.
  report-scheduled-failure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: verify
    if: failure() && github.event_name == 'schedule'
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: tools/open-ci-failure-issue.sh
          sparse-checkout-cone-mode: false
          filter: blob:none
      - name: Open issue on scheduled failure
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/open-ci-failure-issue.sh "ci/verify"

  # Apple targets cannot build on Linux; without this leg the published iOS
  # frameworks were compiled/tested nowhere (kotlin.native.ignoreDisabledTargets
  # silenced the gap on the ubuntu job).
  verify-apple:
    runs-on: macos-latest
    timeout-minutes: 75
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      # The Apple leg compiles/links three iOS targets — the heaviest
      # Kotlin/Native work in CI. Caching ~/.konan (compiler + platform libs +
      # klib caches) avoids re-downloading and re-warming it on every run.
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Verify Apple targets (compile all, test simulator)
        id: apple_targets
        run: ./gradlew iosSimulatorArm64Test compileKotlinIosArm64 compileKotlinIosX64
      - name: Verify Swift import smoke
        id: swift_import_smoke
        env:
          REQUIRE_REAL_SMOKE: "1"
        run: tools/run-ios-swift-smoke
      - name: Assert verify-apple gate ledger
        if: always()
        run: |
          node tools/assert-expected-gates.mjs verify-apple \
            "apple-targets=${{ steps.apple_targets.outcome }}" \
            "swift-import-smoke=${{ steps.swift_import_smoke.outcome }}"

  # samples/jvm-chat-cli has its own Gradle build + Dependabot entry but was never
  # compiled in CI — Dependabot could automerge uncompiled sample bumps. Builds
  # against mavenLocal from a fresh publishToMavenLocal of this SHA.
  sample-jvm-chat-cli:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Publish library to mavenLocal
        run: ./gradlew publishToMavenLocal
      - name: Build jvm-chat-cli sample
        run: |
          set -euo pipefail
          version="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' gradle.properties)"
          ./gradlew -p samples/jvm-chat-cli build -PaisdkVersion="${version}"

  # jvmAndAndroidMain carries ProcessBuilder MCP stdio + java.security actuals.
  # Linux-only JVM tests miss Windows path/process/line-ending failures.
  verify-windows-jvm:
    runs-on: windows-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: JVM tests on Windows
        run: ./gradlew jvmTest
