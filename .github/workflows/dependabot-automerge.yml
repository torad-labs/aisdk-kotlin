# Auto-merge green Dependabot PRs (patch/minor only; majors wait for a human).
# `gh pr merge --auto` only ENABLES auto-merge: GitHub performs the merge solely after
# main's required checks pass — that branch protection is what makes this safe. In this
# repo the checks that matter are the non-bypassable verify job (ci-gate.sh + ./gradlew
# check + ABI validation) and codeql/dependency-review.
#
# Gradle bumps are expected to sit un-merged until a maintainer regenerates
# gradle/verification-metadata.xml on the PR branch (see .github/dependabot.yml). That is
# the intended behaviour: auto-merge waits for green rather than merging an unverifiable
# dependency set.
#
# Dependabot-triggered runs only receive the permissions declared below.
name: dependabot-automerge

on: pull_request

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    if: github.event.pull_request.user.login == 'dependabot[bot]' && github.repository == 'torad-labs/aisdk-kotlin'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch/minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
