# Dependabot PR helpers (Actions). Config for *what* Dependabot bumps lives in
# .github/dependabot.yml (GitHub-reserved path — not a workflow).
#
# Jobs (Dependabot PRs only):
#   1. verification-metadata — regenerate gradle/verification-metadata.xml checksums
#      from the PR head. READ-ONLY: this runs the PR's own Gradle build, so it must
#      never hold a writable token (see job note).
#   2. publish-verification-metadata — push the regenerated file onto the Dependabot
#      branch. Holds `contents: write` but executes no build.
#   3. automerge — enable auto-merge for patch/minor; GitHub merges only after
#      required checks pass (verify, verify-apple, dependency-review).
#
# automerge needs the publish job so checksum regen finishes before we arm merge
# (a push from regen re-triggers checks on the updated tip).
name: dependabot

on: pull_request

permissions:
  contents: read

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verification-metadata:
    # `github.event.pull_request.user.login`, not `github.actor`: actor is whoever triggered
    # the run and is spoofable (a re-run or a synchronize by someone else carries their name,
    # and zizmor's bot-conditions audit flags it), whereas the PR author is fixed at open
    # time. `automerge` below already used this form.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'torad-labs/aisdk-kotlin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only, and the checkout keeps no credentials. `./gradlew` below CONFIGURES the
    # build from the PR head, so a Dependabot bump of a Gradle plugin executes that
    # plugin's code in this job — the actor check proves who opened the PR, not that the
    # bumped artifact is trustworthy. A writable token here was reachable by that code.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.regen.outputs.changed }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Regenerate verification-metadata checksums
        id: regen
        run: |
          set -euo pipefail
          ./gradlew --write-verification-metadata sha256 help
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "verification-metadata.xml unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Upload regenerated metadata
        if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-metadata-${{ github.run_id }}
          path: gradle/verification-metadata.xml
          retention-days: 1

  # Holds the writable token, runs no build: checkout + download + commit only. The file
  # it pushes was produced by PR-controlled code, but it lands as a reviewable commit on
  # the PR branch and still has to clear the required checks before automerge can merge.
  publish-verification-metadata:
    # `github.event.pull_request.user.login`, not `github.actor`: actor is whoever triggered
    # the run and is spoofable (a re-run or a synchronize by someone else carries their name,
    # and zizmor's bot-conditions audit flags it), whereas the PR author is fixed at open
    # time. `automerge` below already used this form.
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'torad-labs/aisdk-kotlin'
    needs: verification-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push regenerated metadata onto the Dependabot branch
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        if: needs.verification-metadata.outputs.changed == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f28c025e4dfd1fb53a7 # v6.0.0
        if: needs.verification-metadata.outputs.changed == 'true'
        with:
          name: verification-metadata-${{ github.run_id }}
          path: gradle
      - name: Commit and push
        if: needs.verification-metadata.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "verification-metadata.xml unchanged after download"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "chore(deps): regenerate verification-metadata.xml for Dependabot"
          # Push with the token on the remote URL rather than persisted in .git/config, so it
          # exists only for this one command. Nothing else in this job executes repo code, but
          # the convention is mechanical (beta-readiness `checkouts do not persist the job token`).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

  automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'torad-labs/aisdk-kotlin'
    needs: publish-verification-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh pr merge --auto
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch/minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
