# Dependency-change PR helpers (Actions).
#
# Runs for Dependabot AND for the operator's own `operator/*` branches. Gating on
# Dependabot alone was a real gap: any PR that changes a resolved dependency needs
# its verification checksums regenerated, and an operator PR pinning patched
# transitives changed 26 of them — every one failing verification with no job
# willing to regenerate. The condition described WHO opened the PR when what
# matters is WHAT it changed. Config for *what* Dependabot bumps lives in
# .github/dependabot.yml (GitHub-reserved path — not a workflow).
#
# Jobs (Dependabot PRs only):
#   1. verification-metadata — regenerate gradle/verification-metadata.xml checksums
#      from the PR head, on LINUX. READ-ONLY: this runs the PR's own Gradle build, so
#      it must never hold a writable token (see job note).
#   2. verification-metadata-apple — the SAME regen on macOS, seeded with (1)'s output.
#      A checksum can only be recorded for an artifact the runner actually downloads,
#      and Kotlin/Native ships a different prebuilt per host: a Linux-only regen never
#      sees kotlin-native-prebuilt-macos-aarch64, so verify-apple failed on every
#      Kotlin bump with "Dependency verification failed" — aisdk-kotlin#20, and every
#      such PR before it. Chained rather than run in parallel because Gradle's
#      generation is INCREMENTAL and preserves existing entries (Gradle docs,
#      "Verifying Dependencies"), so running Linux-then-macOS accumulates both
#      platforms into one file. Two parallel jobs would instead produce two partial
#      files that something would then have to merge by hand.
#   3. publish-verification-metadata — push the regenerated file onto the Dependabot
#      branch. Holds `contents: write` but executes no build.
#   4. automerge — enable auto-merge for patch/minor; GitHub merges only after
#      required checks pass (verify, verify-apple, dependency-review).
#
# automerge needs the publish job so checksum regen finishes before we arm merge
# (a push from regen re-triggers checks on the updated tip).
name: dependabot

on: pull_request

permissions:
  contents: read

concurrency:
  group: dependabot-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  verification-metadata:
    # `github.event.pull_request.user.login`, not `github.actor`: actor is whoever triggered
    # the run and is spoofable (a re-run or a synchronize by someone else carries their name,
    # and zizmor's bot-conditions audit flags it), whereas the PR author is fixed at open
    # time. `automerge` below already used this form.
    if: >-
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       startsWith(github.event.pull_request.head.ref, 'operator/')) &&
      github.repository == 'torad-labs/aisdk-kotlin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Read-only, and the checkout keeps no credentials. `./gradlew` below CONFIGURES the
    # build from the PR head, so a Dependabot bump of a Gradle plugin executes that
    # plugin's code in this job — the actor check proves who opened the PR, not that the
    # bumped artifact is trustworthy. A writable token here was reachable by that code.
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.regen.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      - name: Regenerate verification-metadata checksums
        id: regen
        run: |
          set -euo pipefail
          ./gradlew --write-verification-metadata sha256 help
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "verification-metadata.xml unchanged"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      # Unconditional: the Apple leg starts from this file either way, so making
      # the upload conditional would just add a branch that has to stay in sync.
      - name: Upload Linux-side metadata
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-metadata-linux-${{ github.run_id }}
          path: gradle/verification-metadata.xml
          retention-days: 1

  # The other half of the checksum set. Same read-only posture as the Linux leg —
  # this also configures the build from the PR head, so a bumped Gradle plugin
  # executes here and must never see a writable token.
  verification-metadata-apple:
    if: >-
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       startsWith(github.event.pull_request.head.ref, 'operator/')) &&
      github.repository == 'torad-labs/aisdk-kotlin'
    needs: verification-metadata
    runs-on: macos-latest
    timeout-minutes: 45
    permissions:
      contents: read
    outputs:
      changed: ${{ steps.regen.outputs.changed }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
      # Mirrors verify-apple in ci.yml: the Kotlin/Native toolchain is the
      # expensive part of any Apple-side Gradle run.
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
      - name: Seed with the Linux-side checksums
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: verification-metadata-linux-${{ github.run_id }}
          path: gradle
      - name: Add the Apple-side checksums
        id: regen
        # Resolving the Apple targets is what pulls kotlin-native-prebuilt for this
        # host; `help` alone would not, which is the whole reason the Linux leg could
        # never produce these entries. `changed` is measured against the COMMITTED
        # file, so it covers both platforms' additions regardless of which leg added
        # them — that makes this job the single source of truth for whether a push
        # is needed.
        run: |
          set -euo pipefail
          ./gradlew --write-verification-metadata sha256 \
            compileKotlinIosArm64 compileKotlinIosSimulatorArm64
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "verification-metadata.xml unchanged on both platforms"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff --stat -- gradle/verification-metadata.xml
          fi
      - name: Upload the combined metadata
        if: steps.regen.outputs.changed == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: verification-metadata-${{ github.run_id }}
          path: gradle/verification-metadata.xml
          retention-days: 1

  # Holds the writable token, runs no build: checkout + download + commit only. The file
  # it pushes was produced by PR-controlled code, but it lands as a reviewable commit on
  # the PR branch and still has to clear the required checks before automerge can merge.
  publish-verification-metadata:
    # `github.event.pull_request.user.login`, not `github.actor`: actor is whoever triggered
    # the run and is spoofable (a re-run or a synchronize by someone else carries their name,
    # and zizmor's bot-conditions audit flags it), whereas the PR author is fixed at open
    # time. `automerge` below already used this form.
    if: >-
      (github.event.pull_request.user.login == 'dependabot[bot]' ||
       startsWith(github.event.pull_request.head.ref, 'operator/')) &&
      github.repository == 'torad-labs/aisdk-kotlin'
    needs: verification-metadata-apple
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # push regenerated metadata onto the Dependabot branch
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: needs.verification-metadata-apple.outputs.changed == 'true'
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          persist-credentials: false
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        if: needs.verification-metadata-apple.outputs.changed == 'true'
        with:
          name: verification-metadata-${{ github.run_id }}
          path: gradle
      - name: Commit and push
        if: needs.verification-metadata-apple.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: |
          set -euo pipefail
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "verification-metadata.xml unchanged after download"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "chore(deps): regenerate verification-metadata.xml for Dependabot"
          # Push with the token on the remote URL rather than persisted in .git/config, so it
          # exists only for this one command. Nothing else in this job executes repo code, but
          # the convention is mechanical (beta-readiness `checkouts do not persist the job token`).
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" \
            "HEAD:refs/heads/${BRANCH}"

  automerge:
    if: >-
      github.event.pull_request.user.login == 'dependabot[bot]' &&
      github.repository == 'torad-labs/aisdk-kotlin'
    needs: publish-verification-metadata
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # gh pr merge --auto
      pull-requests: write
    steps:
      - uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        id: meta
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
      - name: Enable auto-merge for patch/minor updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        run: gh pr merge --auto --squash "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
