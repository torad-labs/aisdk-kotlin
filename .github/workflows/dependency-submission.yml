# Submit the Gradle dependency graph to GitHub so dependency-review can see the
# dependencies that actually ship (not only package.json / Actions pins).
#
# Without this, dependency-review is green-but-inert for the published artifact
# graph — the exact failure mode the workflow comment warns against. Runs on
# main (and manually) so the baseline graph stays current for PR diffs.
name: dependency-submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # GENERATE — runs the Gradle build, holds NO write token.
  #
  # Split from the submit step per the action's own `generate-and-upload` /
  # `download-and-submit` contract, which exists for exactly this: "where the workflow
  # generating the dependency-graph cannot (or should not) be given the `contents: write`
  # permissions". Resolving the graph configures the build, so plugin code executes here;
  # a job's `permissions:` cannot be narrowed per step, so a write token granted for the
  # submit call would have been reachable by that plugin code for the whole run.
  #
  # This is the same shape as the release workflow's signing split and the Dependabot
  # metadata split: the job that runs repository-controlled code and the job that holds
  # the credential are never the same job.
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Generate Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        env:
          # PIN THE CORRELATOR. GitHub keys dependency snapshots by job.correlator, and
          # the action defaults it to `${workflow}-${job}`
          # (DependencyGraphConfig.constructJobCorrelator). A correlator derived from the
          # job id means renaming a job silently forks the snapshot history instead of
          # continuing it — and per GitHub's dependency-submission docs, "if there are two
          # correlators with the same detector, the resolved dependencies are MERGED".
          # The old snapshot is not superseded; it is merged in, forever.
          #
          # That is exactly how this repo kept one advisory open. Splitting this workflow
          # into generate/submit renamed the job `dependency-submission` -> `generate`, so
          # the pinned httpclient 4.5.14 landed under a NEW correlator while the previous
          # snapshot went on reporting 4.5.6 from an orphaned one. The submitted artifact
          # contained only 4.5.14; the repo SBOM showed both. The orphan was cleared by
          # posting an empty snapshot at the stale correlator.
          #
          # `maybeExportVariable` only sets this when it is unset, so an explicit value
          # here wins. Job ids stay free to change; the snapshot lineage does not.
          GITHUB_DEPENDENCY_GRAPH_JOB_CORRELATOR: dependency-submission-generate
        with:
          dependency-graph: generate-and-upload
        # THE FULL GRAPH IS GENERATED ON PURPOSE — build classpath and Swift-export tooling
        # included, not only what ships.
        #
        # An earlier revision filtered the graph down to *RuntimeClasspath so the 15
        # build-only advisories would stop appearing. That was the wrong trade. The alerts
        # were never FALSE — they reported genuinely vulnerable versions that were simply
        # unfixed — and a filtered list leaves the reader with the question the whole
        # mechanism exists to answer: "is this list complete?" A short list you distrust is
        # worse than a long list you have driven to zero.
        #
        # So the contract is: submit everything, PIN everything, keep the count at zero.
        # Any alert that appears is then a real unpatched dependency by construction,
        # whether it reaches consumers or only the build — and a compromised build is a
        # supply-chain compromise, so that lane deserves the same visibility.
        #
        # Pins live in settings.gradle.kts (settings plugin classpath) and build.gradle.kts
        # (buildscript classpath + configurations.all). When a new advisory lands, the
        # answer is a pin, not a filter.

  # SUBMIT — holds the write token, runs no build. Downloads the artifact the generate job
  # produced and posts it to the dependency-submission API.
  submit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: generate
    permissions:
      contents: write # dependency snapshot submission; nothing else runs in this job
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Submit dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          dependency-graph: download-and-submit
