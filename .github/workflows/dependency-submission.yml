# Submit the Gradle dependency graph to GitHub so dependency-review can see the
# dependencies that actually ship (not only package.json / Actions pins).
#
# Without this, dependency-review is green-but-inert for the published artifact
# graph — the exact failure mode the workflow comment warns against. Runs on
# main (and manually) so the baseline graph stays current for PR diffs.
name: dependency-submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # required to submit the dependency snapshot
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        # THE FULL GRAPH IS SUBMITTED ON PURPOSE — build classpath and Swift-export tooling
        # included, not only what ships.
        #
        # An earlier revision of this file filtered the graph down to *RuntimeClasspath so
        # the 15 build-only advisories would stop appearing. That was the wrong trade. The
        # alerts were never FALSE — they reported genuinely vulnerable versions that were
        # simply unfixed — and a filtered list leaves the reader with the question the whole
        # mechanism exists to answer: "is this list complete?" A short list you distrust is
        # worse than a long list you have driven to zero.
        #
        # So the contract here is: submit everything, PIN everything, and keep the alert
        # count at zero. Any alert that appears is then a real unpatched dependency by
        # construction, whether it reaches consumers or only the build — and a compromised
        # build is a supply-chain compromise, so that lane deserves the same visibility.
        #
        # The pins live in build.gradle.kts (buildscript classpath) and in the
        # swiftExportClasspathResolvable block beside it. When a new advisory lands, the
        # answer is a pin, not a filter.
