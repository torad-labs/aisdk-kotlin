# Submit the Gradle dependency graph to GitHub so dependency-review can see the
# dependencies that actually ship (not only package.json / Actions pins).
#
# Without this, dependency-review is green-but-inert for the published artifact
# graph — the exact failure mode the workflow comment warns against. Runs on
# main (and manually) so the baseline graph stays current for PR diffs.
name: dependency-submission

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-submission:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # required to submit the dependency snapshot
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - name: Submit Gradle dependency graph
        uses: gradle/actions/dependency-submission@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
