name: Release

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Stage, sign, and smoke-test artifacts without publishing"
        required: false
        default: false
        type: boolean
  push:
    tags:
      - "v*"

permissions:
  contents: read

# One release at a time per ref. cancel-in-progress: false so a tag push is never
# cancelled mid-Central-upload by a concurrent dry-run dispatch.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  AI_SDK_REFERENCE_VERSION: 6.0.208
  AI_SDK_REFERENCE_COMMIT: 3270146267b1d82f07972bc40f09e9b4ee8bb9d3

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Verify release tag
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
        run: |
          set -euo pipefail
          project_version="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' gradle.properties)"
          group="$(awk -F= '$1 == "GROUP" { print $2 }' gradle.properties)"
          artifact="$(awk -F= '$1 == "POM_ARTIFACT_ID" { print $2 }' gradle.properties)"

          if [[ "${project_version}" == *-SNAPSHOT ]]; then
            echo "Release tags must not publish SNAPSHOT versions: ${project_version}" >&2
            exit 1
          fi

          # Maven Central coordinates are immutable. Fail closed if this VERSION_NAME
          # is already on repo1 so we never plan a retag/republish of a shipped line
          # (the 0.3.0-beta01 trap). Dry-run still checks so local smoke cannot lie.
          # Fail closed on every outcome except a definite "not published". `|| true` plus a
          # 200-only rejection made this gate open on the failures it exists to survive: a
          # timeout, DNS error, proxy interception or repo1 5xx all left central_code empty
          # or non-200 and were reported as "not yet listed", clearing the way to republish
          # over a shipped coordinate. Only 404 (and 410, tombstoned) prove absence.
          group_path="${group//.//}"
          central_pom="https://repo1.maven.org/maven2/${group_path}/${artifact}/${project_version}/${artifact}-${project_version}.pom"
          if ! central_code="$(curl -sS -o /dev/null -w '%{http_code}' --retry 3 --retry-connrefused --max-time 30 "${central_pom}")"; then
            echo "::error::Maven Central preflight could not reach ${central_pom}. Refusing to release without proof the coordinate is free." >&2
            exit 1
          fi
          case "${central_code}" in
            404|410)
              echo "Maven Central does not list ${project_version} (HTTP ${central_code})."
              ;;
            200)
              echo "::error::VERSION_NAME ${project_version} is already on Maven Central (${central_pom}). Bump VERSION_NAME (e.g. beta02) before releasing." >&2
              exit 1
              ;;
            *)
              echo "::error::Unexpected Maven Central status ${central_code} for ${central_pom}. Refusing to release without proof the coordinate is free." >&2
              exit 1
              ;;
          esac

          if [ "${DRY_RUN}" = "true" ]; then
            echo "Dry-run release preflight for ${project_version} on ${GITHUB_REF_NAME}; tag and main-ancestry checks are publish-only."
            exit 0
          fi
          tag_version="${GITHUB_REF_NAME#v}"
          test "${tag_version}" = "${project_version}"
          git fetch origin main
          git merge-base --is-ancestor "${GITHUB_SHA}" origin/main
      - name: Beta readiness gate
        run: tools/beta-readiness-check

  verify-apple:
    runs-on: macos-latest
    timeout-minutes: 75
    needs: preflight
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # Release produces signed artifacts, so no mutable cache may feed a publish —
          # read OR write. cache-read-only stopped this path WRITING a cache but it still
          # restored one, which is the half zizmor's cache-poisoning audit flags. A release
          # runs once per version, so the lost cache warm costs little next to a build that
          # cannot be influenced by any earlier run's artifacts.
          cache-disabled: true
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
          lookup-only: true
      - name: Verify Apple targets (compile all, test simulator)
        run: ./gradlew iosSimulatorArm64Test compileKotlinIosArm64 compileKotlinIosX64
      - name: Verify Swift import smoke
        run: tools/run-ios-swift-smoke

  # Verification runs WITHOUT publish credentials. Everything here resolves or executes
  # third-party code -- an upstream clone, npm dependency lifecycle scripts, the Gradle
  # test suite and its plugins -- so none of it may share a job with SIGNING_KEY or
  # id-token: write. A compromised dependency running beside the signing key would yield
  # SIGNED artifacts on Maven Central, which is unrecoverable for a published library.
  #
  # Fail-closed behaviour is unchanged: the aggregator below still exits non-zero when any
  # gate fails, and publish consumes this job via needs:, so a red gate stops the release
  # before anything is staged.
  verify-release:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    needs:
      - preflight
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # Release produces signed artifacts, so no mutable cache may feed a publish —
          # read OR write. cache-read-only stopped this path WRITING a cache but it still
          # restored one, which is the half zizmor's cache-poisoning audit flags. A release
          # runs once per version, so the lost cache warm costs little next to a build that
          # cannot be influenced by any earlier run's artifacts.
          cache-disabled: true
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
          lookup-only: true
      - name: Fetch Vercel AI SDK v6 reference
        run: |
          mkdir -p .reference
          git clone --depth 1 --branch ai@${AI_SDK_REFERENCE_VERSION} https://github.com/vercel/ai .reference/vercel-ai-sdk-ai-${AI_SDK_REFERENCE_VERSION}
          actual_commit="$(git -C .reference/vercel-ai-sdk-ai-${AI_SDK_REFERENCE_VERSION} rev-parse HEAD)"
          test "${actual_commit}" = "${AI_SDK_REFERENCE_COMMIT}"
      - name: Verify AI SDK reference version
        id: ai_sdk_reference
        continue-on-error: true
        run: node tools/check-ai-sdk-reference.mjs
      - name: Verify parity ledgers
        id: parity_ledgers
        continue-on-error: true
        run: node tools/generate-parity-ledger.mjs --check
      # Release publishing deliberately fails closed on locked npm tooling. The
      # regular ci.yml verify job uses GH-13's checksum-pinned ast-grep binary
      # before npm ci so internal gates keep running during npm/network outages;
      # a publish path should instead stop before staging artifacts if its locked
      # release environment cannot be installed.
      - name: Install locked Node tooling
        run: npm ci
      - name: Architecture gate (ast-grep rules + structural checks)
        id: architecture_gate
        continue-on-error: true
        run: ./node_modules/.bin/ast-grep --version && PATH="$PWD/node_modules/.bin:$PATH" bash .claude/hooks/rules/ci-gate.sh
      - name: Beta readiness gate
        id: beta_readiness
        continue-on-error: true
        run: tools/beta-readiness-check
      - name: Verify checks
        id: gradle_check
        continue-on-error: true
        run: ./gradlew check
      - name: Summarize pre-publish gates
        if: always()
        run: |
          gates=(
            "ai_sdk_reference|Verify AI SDK reference version|${{ steps.ai_sdk_reference.outcome }}"
            "parity_ledgers|Verify parity ledgers|${{ steps.parity_ledgers.outcome }}"
            "architecture_gate|Architecture gate (ast-grep rules + structural checks)|${{ steps.architecture_gate.outcome }}"
            "beta_readiness|Beta readiness gate|${{ steps.beta_readiness.outcome }}"
            "gradle_check|Verify checks|${{ steps.gradle_check.outcome }}"
          )

          failed=0
          printf '| Step id | Gate | Outcome |\n'
          printf '| --- | --- | --- |\n'
          for gate in "${gates[@]}"; do
            IFS='|' read -r step_id name outcome <<< "$gate"
            printf '| `%s` | %s | %s |\n' "$step_id" "$name" "$outcome"
            if [ "$outcome" != "success" ]; then
              failed=1
            fi
          done

          exit "$failed"

  # Credentialed job. It holds SIGNING_KEY / SONATYPE_* and id-token: write, so it runs
  # ONLY the staging publish, signing, attestation and upload. Those cannot move -- the
  # signed bundle has to be produced here -- so Gradle plugins still execute in this job
  # by necessity; that residual exposure is the honest limit of this split. What it does
  # remove from the key's blast radius is the whole test suite, npm, and the upstream
  # clone. Enforced by detect-release-workflow-trust.py.
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs:
      - preflight
      - verify-apple
      - verify-release
    permissions:
      # contents:write — create the GitHub Release + attach bundle.zip/SBOM so
      # consumer-canary can gh release download + attest-verify (gap #1).
      contents: write
      packages: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # Release produces signed artifacts, so no mutable cache may feed a publish —
          # read OR write. cache-read-only stopped this path WRITING a cache but it still
          # restored one, which is the half zizmor's cache-poisoning audit flags. A release
          # runs once per version, so the lost cache warm costs little next to a build that
          # cannot be influenced by any earlier run's artifacts.
          cache-disabled: true
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
          lookup-only: true
      # Maven Central is the release target. The Central Portal takes a single zip
      # in Maven Repository Layout, validates it asynchronously, and (with
      # publishingType=AUTOMATIC) syncs to Maven Central if validation passes.
      # This step stages/signs/bundles the artifacts and intentionally stays
      # fail-fast after the pre-publish gate aggregator above. Dry-run proves
      # local staging/signing/smoke only; it cannot prove Central auth or the
      # Central Portal state machine.
      - name: Build Maven Central release bundle
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run == true }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: |
          set -euo pipefail
          # Stage every KMP publication (jvm, android, ios*, linux, and the root
          # metadata module) into a local Maven-layout directory, signed.
          # --no-configuration-cache: the build enables the configuration cache
          # globally, but the signing plugin's tasks aren't config-cache compatible
          # and PublishToMavenRepository captures Project references — both only
          # surface during real (remote) publishing, which is CI-only anyway.
          ./gradlew publishAllPublicationsToLocalStagingRepository --no-configuration-cache
          tools/run-local-staging-smoke --no-publish --staging-repo build/staging-deploy
          # A release bundle must contain only the versioned artifacts. The Portal
          # generates its own group-level metadata, and leaving version-listing
          # maven-metadata.xml in the zip can trip bundle validation.
          find build/staging-deploy -name 'maven-metadata.xml*' -delete
          ( cd build/staging-deploy && zip -q -r ../../bundle.zip . )
          artifact_count=$(find build/staging-deploy -type f \( -name '*.aar' -o -name '*.jar' -o -name '*.klib' -o -name '*.module' -o -name '*.pom' \) | wc -l | tr -d '[:space:]')
          if [ "${DRY_RUN}" = "true" ]; then
            echo "DRY RUN: would publish ${artifact_count} artifacts"
          fi
          echo "artifact_count=${artifact_count}" >> "${GITHUB_OUTPUT}"
      # SBOM of the staged Maven layout (not the whole runner FS). Attested on
      # real publishes so consumers can verify the release coordinate set.
      - name: Generate release SBOM
        uses: anchore/sbom-action@e22c389904149dbc22b58101806040fa8d37a610 # v0.24.0
        with:
          path: build/staging-deploy
          format: spdx-json
          artifact-name: torad-aisdk-sbom.spdx.json
          output-file: torad-aisdk-sbom.spdx.json
          # Attached to the GitHub Release below (not only the ephemeral Actions artifact).
          upload-artifact: true
          upload-release-assets: false
      - name: Attest Maven Central bundle provenance
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: bundle.zip
      - name: Attest release SBOM provenance
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        uses: actions/attest-build-provenance@0f67c3f4856b2e3261c31976d6725780e5e4c373 # v4.1.1
        with:
          subject-path: torad-aisdk-sbom.spdx.json
      - name: Publish to Maven Central
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        env:
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: |
          set -euo pipefail
          token=$(printf '%s:%s' "${SONATYPE_USERNAME}" "${SONATYPE_PASSWORD}" | base64 -w 0)
          # Upload. The response body is the deployment id (a UUID).
          if ! deployment_id=$(curl --fail-with-body --silent --show-error --request POST \
              --url 'https://central.sonatype.com/api/v1/publisher/upload?publishingType=AUTOMATIC' \
              --header "Authorization: Bearer ${token}" \
              --form 'bundle=@bundle.zip'); then
            echo "::error::Central Portal upload failed: ${deployment_id}" >&2
            exit 1
          fi
          deployment_id=$(printf '%s' "${deployment_id}" | tr -d '[:space:]')
          echo "Central Portal deployment id: ${deployment_id}"
          # AUTOMATIC validates asynchronously: a malformed bundle still returns 201
          # on upload but FAILS validation later. Poll the deployment so a broken
          # release can never report success.
          for attempt in $(seq 1 40); do
            body=$(curl --fail-with-body --silent --show-error --request POST \
              --url "https://central.sonatype.com/api/v1/publisher/status?id=${deployment_id}" \
              --header "Authorization: Bearer ${token}") \
              || { echo "[${attempt}] status poll errored, retrying"; sleep 15; continue; }
            state=$(printf '%s' "${body}" | python3 -c "import sys,json; print(json.loads(sys.stdin.read().strip() or '{}').get('deploymentState',''))")
            echo "[${attempt}] deploymentState=${state}"
            case "${state}" in
              PUBLISHED|PUBLISHING)
                echo "Maven Central deployment validated; publishing to repo1."
                exit 0 ;;
              FAILED)
                echo "::error::Central Portal validation failed:" >&2
                printf '%s\n' "${body}" >&2
                exit 1 ;;
            esac
            sleep 15
          done
          echo "::error::Timed out waiting for Central Portal deployment ${deployment_id}" >&2
          exit 1
      # GitHub Packages is a best-effort mirror; never let it block a Central
      # release. Re-runs of the same version 409 (GitHub Packages is immutable),
      # which is fine to ignore here.
      - name: Publish to GitHub Packages (best effort)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
        run: ./gradlew publishAllPublicationsToGitHubPackagesRepository --no-configuration-cache
      # Resolve the freshly published coordinates from GitHub Packages (immediate,
      # unlike Central which has propagation delay). This also exercises the KMP
      # module metadata. Best-effort: it depends on the mirror above.
      - name: Verify published artifact resolves (GitHub Packages)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        continue-on-error: true
        env:
          GITHUB_ACTOR: ${{ github.actor }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version="$(awk -F= '$1 == "VERSION_NAME" { print $2 }' gradle.properties)"
          mkdir -p build
          cat > build/release-smoke.gradle.kts <<EOF
          repositories {
              maven {
                  url = uri("https://maven.pkg.github.com/torad-labs/aisdk-kotlin")
                  credentials {
                      username = System.getenv("GITHUB_ACTOR")
                      password = System.getenv("GITHUB_TOKEN")
                  }
              }
              google()
              mavenCentral()
          }
          configurations { create("smoke") }
          dependencies { "smoke"("ai.torad:torad-aisdk:${version}") }
          tasks.register("verifyPublishedArtifact") {
              doLast { configurations["smoke"].resolve().forEach { println(it.name) } }
          }
          EOF
          ./gradlew -b build/release-smoke.gradle.kts verifyPublishedArtifact --refresh-dependencies
      # Consumer-canary downloads bundle.zip from the GitHub Release and runs
      # `gh attestation verify` on it. Without this step that canary is permanently
      # stuck on "waiting on first release". Also attaches the SPDX SBOM next to
      # the bundle so the release coordinate set is durable beyond artifact retention.
      - name: Create GitHub Release (bundle.zip + SBOM)
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.dry_run != true }}
        # zizmor: ignore[superfluous-actions] informational: `gh release create` is the
        # equivalent, and dropping a third-party action from the credential-bearing publish
        # job would be a real gain — but this step only ever executes on a genuine tag push,
        # so a rewrite cannot be exercised before the release it would break. The action is
        # SHA-pinned and Dependabot-tracked. Revisit deliberately, not to satisfy a lint.
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          files: |
            bundle.zip
            torad-aisdk-sbom.spdx.json
          fail_on_unmatched_files: true
          generate_release_notes: true
