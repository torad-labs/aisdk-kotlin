name: Docs

# workflow_run is intentional: Docs must deploy only after a successful tag-push
# Release (not on every main push, not on dry-run dispatch). The job further
# filters to conclusion==success && event==push and checks out the release SHA
# with contents:read only — no PR code, no write to the source repo.
on: # zizmor: ignore[dangerous-triggers] gated deploy after successful Release tag push
  workflow_run:
    workflows:
      - Release
    types:
      - completed

permissions:
  contents: read

jobs:
  build-docs:
    if: ${{ github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          # `./gradlew dokkaGenerate` below runs the checked-out build; nothing here pushes,
          # so the job token has no reason to sit in .git/config where that build can read it.
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          # Caching disabled: this job runs from workflow_run in the privileged
          # default-branch context and checks out workflow_run.head_sha, so a
          # build from untrusted code would populate a cache that later
          # privileged runs restore. CodeQL flags exactly this as
          # actions/cache-poisoning/poisonable-step (high). Docs build once per
          # release; a cold Gradle start is cheaper than the vector.
          cache-disabled: true
      - name: Configure GitHub Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Generate Dokka HTML
        run: ./gradlew dokkaGenerate
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: build/dokka/html

  deploy-pages:
    needs: build-docs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
