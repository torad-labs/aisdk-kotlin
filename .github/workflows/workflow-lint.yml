# Static analysis of GitHub Actions workflows themselves.
#
# - actionlint: syntax, expression types, common shell pitfalls in `run:` blocks
# - zizmor: security-oriented audit (untrusted input into run:, pull_request_target
#   footguns, overly broad permissions, template injection)
#
# Both tools are checksum-pinned binaries (same integrity bar as AST_GREP in ci.yml).
# Not a main required check yet — land signal first, promote if clean.
name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/actions/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: workflow-lint-${{ github.ref }}
  cancel-in-progress: true

env:
  ACTIONLINT_VERSION: "1.7.12"
  ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
  ZIZMOR_VERSION: "1.28.0"
  ZIZMOR_SHA256: "e87b67160194884e375a46a12c57ccc904f762b53845f254fab7f17d98809c09"

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint (checksum-pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o actionlint.tgz \
            "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          echo "${ACTIONLINT_SHA256}  actionlint.tgz" | sha256sum -c -
          tar -xzf actionlint.tgz actionlint
          install -m 0755 actionlint /usr/local/bin/actionlint
          actionlint -version

      - name: Install zizmor (checksum-pinned)
        run: |
          set -euo pipefail
          curl -fsSL -o zizmor.tgz \
            "https://github.com/zizmorcore/zizmor/releases/download/v${ZIZMOR_VERSION}/zizmor-x86_64-unknown-linux-gnu.tar.gz"
          echo "${ZIZMOR_SHA256}  zizmor.tgz" | sha256sum -c -
          tar -xzf zizmor.tgz
          install -m 0755 zizmor /usr/local/bin/zizmor
          zizmor --version

      - name: actionlint
        # Shellcheck infos (SC2086 etc.) stay as annotations; actionlint still
        # exits non-zero on real syntax/type errors.
        run: actionlint -color -shellcheck=

      - name: zizmor
        # High+high only for the merge gate: full pedantic is useful locally /
        # with --persona=auditor, but drowns CI in accepted tradeoffs (workflow_run
        # docs deploy, release caches, job-level write for stale bots).
        run: zizmor --min-severity=high --min-confidence=high .github/workflows
