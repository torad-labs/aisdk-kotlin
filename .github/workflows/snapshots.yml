name: Snapshot

# OPERATOR HOLD (2026-07-03, RR-06): no distributions until release go — the
# push-to-main trigger is parked so the fold-in merge cannot fire the first
# snapshot publish. Re-arm at release time by restoring:
#   push:
#     branches:
#       - main
#
# AFTER a release tag ships, bump VERSION_NAME on main (e.g. 0.3.0-beta01 →
# 0.3.0-beta02 or 0.3.1-SNAPSHOT intent) BEFORE re-arming. Snapshot version is
# derived from VERSION_NAME (build.gradle.kts): leaving it at a just-published
# release coordinate republishes that line as `-SNAPSHOT`, which confuses
# consumers and fights the immutable Central release.
on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: snapshots-main
  cancel-in-progress: false

jobs:
  publish-snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-java@03ad4de0992f5dab5e18fcb136590ce7c4a0ac95 # v5.6.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      # Publish path: read cache only so a poisoned PR cache cannot enter the
      # snapshot artifacts (zizmor cache-poisoning).
      - uses: gradle/actions/setup-gradle@3f131e8634966bd73d06cc69884922b02e6faf92 # v6.2.0
        with:
          cache-read-only: true
      - name: Cache Kotlin/Native toolchain (~/.konan)
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.konan
          key: konan-${{ runner.os }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-
          lookup-only: true
      - name: Publish Maven Central snapshot
        env:
          SNAPSHOT_PUBLISH: "1"
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}
        run: ./gradlew publishAllPublicationsToCentralSnapshotsRepository --no-configuration-cache
