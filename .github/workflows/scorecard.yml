# OpenSSF Scorecard — weekly + main-push supply-chain score. Not a merge gate;
# results land in the Security → Code scanning tab and as a workflow summary.
#
# What it grades that we care about: branch protection, pinned Actions, token
# permissions, dangerous workflow patterns, maintained dependencies, code review.
name: scorecard

on:
  schedule:
    # Offset from CodeQL (17 4 * * 3) and consumer-canary (37 9 * * 1).
    - cron: "41 5 * * 1"
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scorecard-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: scorecard
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      id-token: write # publish_results OIDC to OpenSSF API / badge
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Run OpenSSF Scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - name: Upload Scorecard SARIF
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81 # v4.37.3
        with:
          sarif_file: results.sarif
