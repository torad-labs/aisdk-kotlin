# Block PRs that introduce vulnerable or licence-incompatible dependencies.
# This library ships under Apache-2.0 to downstream Kotlin/KMP consumers, so a copyleft
# transitive dependency is a licensing hazard for every consumer, not just for us.
#
# PREREQUISITE — this job CANNOT pass until Dependency graph is enabled for the repository.
# Measured on PR #14 (its first run): the action fails in ~5s with
#   "Dependency review is not supported on this repository."
# and the underlying API it calls,
#   GET /repos/torad-labs/aisdk-kotlin/dependency-graph/compare/{base}...{head}
# returns 403 Forbidden — even though Dependabot alerts are already on
# (/vulnerability-alerts returns 204). That combination means the toggle is off at the
# ORG level, not the repo level, so it cannot be fixed from a workflow or with a
# repo-scoped token.
#
# Fix (repo or org owner, one toggle):
#   Settings -> Code security and analysis -> Dependency graph -> Enable
#   or org-wide: https://github.com/organizations/torad-labs/settings/security_analysis
#
# Deliberately NOT given `continue-on-error: true`. A green-but-inert security check is
# worse than an absent one — it reads as coverage while reviewing nothing. The red here is
# truthful: dependency review is genuinely not running.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: >-
            AGPL-1.0-only,
            AGPL-1.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0-only,
            GPL-3.0-or-later,
            SSPL-1.0
