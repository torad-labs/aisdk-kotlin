# Block PRs that introduce vulnerable or licence-incompatible dependencies.
# This library ships under Apache-2.0 to downstream Kotlin/KMP consumers, so a copyleft
# transitive dependency is a licensing hazard for every consumer, not just for us.
#
# Requires Dependency graph (enabled for this repo). Reviews the PR's manifest diff via
#   GET /repos/{owner}/{repo}/dependency-graph/compare/{base}...{head}
# and fails on moderate+ advisories or denied licenses.
#
# Deliberately NOT given `continue-on-error: true`. A green-but-inert security check is
# worse than an absent one. Required on main (branch protection) once the graph is on.
name: dependency-review

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: dependency-review-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: review dependency changes
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate
          deny-licenses: >-
            AGPL-1.0-only,
            AGPL-1.0-or-later,
            AGPL-3.0-only,
            AGPL-3.0-or-later,
            GPL-2.0-only,
            GPL-2.0-or-later,
            GPL-3.0-only,
            GPL-3.0-or-later,
            SSPL-1.0
