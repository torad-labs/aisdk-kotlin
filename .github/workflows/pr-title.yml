# Conventional-commit lint on PR titles (squash-merge titles become main's history).
# The type list is derived from this repo's actual history, not from the generic
# conventional-commits set — `style`, `harden`, and `campaign` are all in use here
# (see git log; `campaign(RR-06): main CI green` is the shape). Adding a type is
# cheaper than rejecting a legitimate PR, but every type here has precedent.
name: pr-title

on:
  pull_request:
    types: [opened, edited, synchronize]

permissions:
  pull-requests: read

concurrency:
  group: pr-title-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6.1.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            test
            build
            ci
            chore
            perf
            refactor
            revert
            style
            release
            harden
            campaign
          requireScope: false
