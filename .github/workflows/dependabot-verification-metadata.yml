# Dependabot cannot regenerate gradle/verification-metadata.xml. Without this
# job every Gradle bump lands red until a human runs
#   ./gradlew --write-verification-metadata sha256 help
# on the PR branch. Automate that regen + push so patch/minor Gradle PRs can
# reach green (and then automerge) without maintainer toil.
#
# Safety net: required checks (verify + dependency-review + dependency graph
# from dependency-submission) still have to pass before automerge lands.
name: dependabot-verification-metadata

on: pull_request

permissions:
  contents: read

concurrency:
  group: dependabot-metadata-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regen:
    if: github.actor == 'dependabot[bot]' && github.repository == 'torad-labs/aisdk-kotlin'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write # push regenerated metadata onto the Dependabot branch
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Dependabot PRs need a token that can push to the head ref.
          ref: ${{ github.event.pull_request.head.ref }}
          token: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@be666c2fcd27ec809703dec50e508c2fdc7f6654 # v5.2.0
        with:
          distribution: temurin
          java-version: "21"
      - uses: android-actions/setup-android@40fd30fb8d7440372e1316f5d1809ec01dcd3699 # v4.0.1
      - uses: gradle/actions/setup-gradle@50e97c2cd7a37755bbfafc9c5b7cafaece252f6e # v6.1.0
      - name: Regenerate verification-metadata checksums
        run: ./gradlew --write-verification-metadata sha256 help
      - name: Commit and push if changed
        run: |
          set -euo pipefail
          if git diff --quiet -- gradle/verification-metadata.xml; then
            echo "verification-metadata.xml unchanged"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gradle/verification-metadata.xml
          git commit -m "chore(deps): regenerate verification-metadata.xml for Dependabot"
          git push
