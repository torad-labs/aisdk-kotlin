# Static security analysis. Weekly cron catches advisories published after a commit
# lands, which push/PR triggers alone never re-examine.
#
# java-kotlin uses build-mode: manual because CodeQL's Kotlin extractor builds the
# project to construct its database. The build is scoped to compileKotlinJvm — that
# traverses commonMain -> jvmAndAndroidMain -> jvmMain, which is the whole shared
# surface, WITHOUT needing the Android SDK or the Kotlin/Native toolchain that a full
# `check` would pull in. Apple/Linux targets carry no CodeQL-supported language.
#
# Kotlin 2.4.0 is analysable as of CodeQL 2.26.0 (supported range is now 1.8.0-2.4.1x).
# If a future Kotlin bump outruns the extractor again the symptom is
# KotlinVersionTooRecentError and the job fails repo-wide on every PR regardless of the
# diff — in that case pin `tools:` on init to a newer bundle rather than deleting the
# job, so the signal is not silently lost.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 4 * * 3"

# Read-only at the top level. `analyze` is the only job here and declares its own
# permissions, and a job-level block REPLACES the top-level one rather than adding to
# it — so granting `security-events: write` here bought nothing and only widened the
# default any future job would inherit. Scorecard's TokenPermissions check flags exactly
# that shape (alert #9, "topLevel 'security-events' permission set to 'write'"). The
# write lives on the job that uploads the SARIF, which is the only thing that needs it.
permissions:
  contents: read

concurrency:
  group: codeql-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze:
    name: codeql-${{ matrix.language }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      security-events: write # upload SARIF to code scanning
      # Documented by GitHub's starter workflow as required for the init action to fetch
      # CodeQL query packs. `actions: read` is deliberately NOT granted — it is only
      # needed for workflows in PRIVATE repositories, and this one is public.
      packages: read
      issues: write # scheduled-failure issue creation
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: java-kotlin
            build-mode: manual
          - language: javascript-typescript
            build-mode: none
          - language: actions
            build-mode: none
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961 # v5.7.0
        if: matrix.language == 'java-kotlin'
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@9c971963bec38e04b3d30dcc455b5382be2fdbfb # v6.3.0
        if: matrix.language == 'java-kotlin'
      - name: initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}
      - name: build Kotlin (JVM source sets)
        if: matrix.language == 'java-kotlin'
        # --no-build-cache is REQUIRED, not tuning. With build-mode: manual the
        # CodeQL extractor only sees code that is actually compiled during this
        # step; a cache hit prints ":compileKotlinJvm FROM-CACHE", nothing is
        # extracted, and "database finalize" then fails as a configuration error.
        run: ./gradlew compileKotlinJvm --no-daemon --no-build-cache --stacktrace
      - name: analyze
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
      - name: Open issue on scheduled failure
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: tools/open-ci-failure-issue.sh "codeql/${{ matrix.language }}"
